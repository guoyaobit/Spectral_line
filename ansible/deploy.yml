---
- name: Package the controller source tree
  hosts: localhost
  gather_facts: false

  vars:
    spectral_line_source_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Allocate a temporary source archive
      ansible.builtin.tempfile:
        state: file
        suffix: .tar.gz
      register: spectral_line_archive

    - name: Archive the local source tree
      ansible.builtin.command:
        argv:
          - tar
          - --exclude=.git
          - --exclude=build
          - --exclude=ansible/inventory.yml
          - --exclude=__pycache__
          - --exclude=*.log
          - -czf
          - "{{ spectral_line_archive.path }}"
          - -C
          - "{{ spectral_line_source_dir }}"
          - .
      changed_when: true

    - name: Expose the archive path to target hosts
      ansible.builtin.set_fact:
        spectral_line_local_archive: "{{ spectral_line_archive.path }}"

- name: Prepare, deploy, and build the receiver cluster
  hosts: spectral_line_servers
  become: true
  strategy: free

  vars:
    spectral_line_install_dir: /opt/Spectral_line
    spectral_line_build_dir: build
    spectral_line_service_user: spectral-line
    spectral_line_hugepage_size: 1G
    spectral_line_hugepages: 16
    spectral_line_iommu_vendor: intel
    spectral_line_build_environment:
      PATH: "/usr/local/cuda/bin:{{ ansible_env.PATH }}"

  tasks:
    - name: Require a Debian-family Linux target
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux"
          - ansible_os_family == "Debian"
        fail_msg: This playbook currently supports Debian and Ubuntu targets.

    - name: Validate boot configuration variables
      ansible.builtin.assert:
        that:
          - spectral_line_hugepages | int > 0
          - spectral_line_hugepage_size in ["1G", "2M"]
          - spectral_line_iommu_vendor in ["intel", "amd"]
        fail_msg: >-
          Set a positive huge-page count, a 1G or 2M page size, and an IOMMU
          vendor of intel or amd.

    - name: Install DPDK and build dependencies
      ansible.builtin.apt:
        name:
          - build-essential
          - dpdk
          - dpdk-dev
          - git
          - libdpdk-dev
          - libelf-dev
          - libfmt-dev
          - libnuma-dev
          - libpcap-dev
          - libspdlog-dev
          - libyaml-cpp-dev
          - meson
          - ninja-build
          - pkg-config
          - python3-pyelftools
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the GRUB drop-in directory
      ansible.builtin.file:
        path: /etc/default/grub.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write DPDK kernel boot parameters
      ansible.builtin.copy:
        dest: /etc/default/grub.d/90-spectral-line.cfg
        owner: root
        group: root
        mode: "0644"
        content: >-
          GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT}
          default_hugepagesz={{ spectral_line_hugepage_size }}
          hugepagesz={{ spectral_line_hugepage_size }}
          hugepages={{ spectral_line_hugepages }} iommu=pt
          {{ 'intel_iommu=on' if spectral_line_iommu_vendor == 'intel' else 'amd_iommu=on' }}"
      register: spectral_line_grub
      notify: Regenerate GRUB configuration

    - name: Apply the GRUB configuration before compilation
      ansible.builtin.meta: flush_handlers

    - name: Report required reboot
      ansible.builtin.debug:
        msg: >-
          GRUB changed on {{ inventory_hostname }}. Reboot this server before
          running the DPDK receiver; this playbook does not reboot automatically.
      when: spectral_line_grub.changed

    - name: Create the service group
      ansible.builtin.group:
        name: "{{ spectral_line_service_user }}"
        system: true

    - name: Create the service account
      ansible.builtin.user:
        name: "{{ spectral_line_service_user }}"
        group: "{{ spectral_line_service_user }}"
        system: true
        home: "{{ spectral_line_install_dir }}"
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create the installation directory
      ansible.builtin.file:
        path: "{{ spectral_line_install_dir }}"
        state: directory
        owner: "{{ spectral_line_service_user }}"
        group: "{{ spectral_line_service_user }}"
        mode: "0755"

    - name: Deploy the controller source archive
      ansible.builtin.unarchive:
        src: "{{ hostvars['localhost'].spectral_line_local_archive }}"
        dest: "{{ spectral_line_install_dir }}"
        owner: "{{ spectral_line_service_user }}"
        group: "{{ spectral_line_service_user }}"

    - name: Verify required build commands and libraries
      become_user: "{{ spectral_line_service_user }}"
      ansible.builtin.command:
        argv: "{{ item }}"
      environment: "{{ spectral_line_build_environment }}"
      loop:
        - [meson, --version]
        - [ninja, --version]
        - [nvcc, --version]
        - [pkg-config, --exists, libdpdk, spdlog, fmt, yaml-cpp]
      changed_when: false

    - name: Check whether Meson is configured
      ansible.builtin.stat:
        path: "{{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}/build.ninja"
      register: spectral_line_build_config

    - name: Configure a new release build
      become_user: "{{ spectral_line_service_user }}"
      ansible.builtin.command:
        argv:
          - meson
          - setup
          - "{{ spectral_line_build_dir }}"
          - --buildtype=release
        chdir: "{{ spectral_line_install_dir }}"
      environment: "{{ spectral_line_build_environment }}"
      when: not spectral_line_build_config.stat.exists

    - name: Reconfigure an existing release build
      become_user: "{{ spectral_line_service_user }}"
      ansible.builtin.command:
        argv:
          - meson
          - setup
          - --reconfigure
          - "{{ spectral_line_build_dir }}"
          - --buildtype=release
        chdir: "{{ spectral_line_install_dir }}"
      environment: "{{ spectral_line_build_environment }}"
      when: spectral_line_build_config.stat.exists

    - name: Compile Spectral_line
      become_user: "{{ spectral_line_service_user }}"
      ansible.builtin.command:
        argv:
          - meson
          - compile
          - -C
          - "{{ spectral_line_build_dir }}"
        chdir: "{{ spectral_line_install_dir }}"
      environment: "{{ spectral_line_build_environment }}"

    - name: Verify the receiver executable
      ansible.builtin.stat:
        path: "{{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}/7mm"
      register: spectral_line_executable

    - name: Require a compiled receiver executable
      ansible.builtin.assert:
        that:
          - spectral_line_executable.stat.exists
          - spectral_line_executable.stat.isreg
        fail_msg: The build completed without producing the 7mm executable.

    - name: Install systemd service units
      ansible.builtin.copy:
        src: "{{ spectral_line_install_dir }}/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop:
        - spectral-line.service
        - spectral-line-monitor.service
      notify: Reload systemd

    - name: Apply installed systemd units
      ansible.builtin.meta: flush_handlers

    - name: Report deployment result
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} compiled
          {{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}/7mm;
          service units are installed but not enabled or started

  handlers:
    - name: Regenerate GRUB configuration
      ansible.builtin.command: update-grub

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Remove the controller source archive
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete the temporary archive
      ansible.builtin.file:
        path: "{{ hostvars['localhost'].spectral_line_local_archive }}"
        state: absent
