---
- name: Package the controller source tree
  hosts: localhost
  gather_facts: false

  vars:
    spectral_line_source_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: Allocate a temporary source archive
      tempfile:
        state: file
        suffix: .tar.gz
      register: spectral_line_archive

    - name: Archive the local source tree
      command:
        argv:
          - tar
          - --exclude=.git
          - --exclude=build
          - --exclude=.venv
          - --exclude=ansible/inventory.yml
          - --exclude=ansible/deployment-summary.md
          - --exclude=Spectral_Line_Recorder
          - --exclude=__pycache__
          - --exclude=*.log
          - -czf
          - "{{ spectral_line_archive.path }}"
          - -C
          - "{{ spectral_line_source_dir }}"
          - .
      changed_when: true

    - name: Expose the archive path to target hosts
      set_fact:
        spectral_line_local_archive: "{{ spectral_line_archive.path }}"

- import_playbook: disable-desktop.yml
  when: not (spectral_line_update_only | default(false) | bool)

- name: Prepare, deploy, and build the receiver cluster
  hosts: spectral_line_servers
  become: true
  strategy: free

  vars:
    spectral_line_install_dir: /opt/Spectral_line
    spectral_line_build_dir: build
    spectral_line_service_user: spectral-line
    spectral_line_build_environment:
      PATH: "/usr/local/cuda/bin:{{ ansible_env.PATH }}"

  tasks:
    - name: Check the existing installation for a code update
      stat:
        path: "{{ spectral_line_install_dir }}"
      register: spectral_line_existing_installation
      when: spectral_line_update_only | default(false) | bool

    - name: Require an existing installation for a code update
      assert:
        that:
          - spectral_line_existing_installation.stat.exists
          - spectral_line_existing_installation.stat.isdir
        fail_msg: >-
          Code-update mode requires an existing installation at
          {{ spectral_line_install_dir }}. Run a full deployment first.
      when: spectral_line_update_only | default(false) | bool

    - name: Update source files without changing the deployed configuration
      unarchive:
        src: "{{ hostvars['localhost'].spectral_line_local_archive }}"
        dest: "{{ spectral_line_install_dir }}"
        owner: "{{ spectral_line_service_user }}"
        group: "{{ spectral_line_service_user }}"
        exclude:
          - config.yaml
          - ./config.yaml
      when: spectral_line_update_only | default(false) | bool

    - name: Verify build tools and libraries for the code update
      become_user: "{{ spectral_line_service_user }}"
      command:
        argv: "{{ item }}"
      environment: "{{ spectral_line_build_environment }}"
      loop:
        - [meson, --version]
        - [ninja, --version]
        - [nvcc, --version]
        - [pkg-config, --exists, libdpdk, spdlog, fmt, yaml-cpp]
      changed_when: false
      when: spectral_line_update_only | default(false) | bool

    - name: Check for the installed receiver service before compilation
      stat:
        path: /etc/systemd/system/spectral-line.service
      register: spectral_line_update_service_unit
      when: spectral_line_update_only | default(false) | bool

    - name: Stop the receiver before replacing the build directory
      systemd:
        name: spectral-line.service
        state: stopped
      when:
        - spectral_line_update_only | default(false) | bool
        - spectral_line_update_service_unit.stat.exists

    - name: Remove the previous build directory for the code update
      file:
        path: "{{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}"
        state: absent
      when: spectral_line_update_only | default(false) | bool

    - name: Create an empty build directory for the code update
      file:
        path: "{{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}"
        state: directory
        owner: "{{ spectral_line_service_user }}"
        group: "{{ spectral_line_service_user }}"
        mode: "0755"
      when: spectral_line_update_only | default(false) | bool

    - name: Configure a clean release build for the code update
      become_user: "{{ spectral_line_service_user }}"
      command:
        argv:
          - meson
          - setup
          - "{{ spectral_line_build_dir }}"
          - --buildtype=release
        chdir: "{{ spectral_line_install_dir }}"
      environment: "{{ spectral_line_build_environment }}"
      when: spectral_line_update_only | default(false) | bool

    - name: Compile the updated receiver
      become_user: "{{ spectral_line_service_user }}"
      command:
        argv:
          - meson
          - compile
          - -C
          - "{{ spectral_line_build_dir }}"
        chdir: "{{ spectral_line_install_dir }}"
      environment: "{{ spectral_line_build_environment }}"
      when: spectral_line_update_only | default(false) | bool

    - name: Verify the updated receiver executable
      stat:
        path: "{{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}/7mm"
      register: spectral_line_update_executable
      when: spectral_line_update_only | default(false) | bool

    - name: Require the updated receiver executable
      assert:
        that:
          - spectral_line_update_executable.stat.exists
          - spectral_line_update_executable.stat.isreg
        fail_msg: The code update did not produce the 7mm executable.
      when: spectral_line_update_only | default(false) | bool

    - name: Report the compiled code update
      debug:
        msg: >-
          {{ inventory_hostname }} source files updated and compiled as
          {{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}/7mm;
          config.yaml, virtual environment, installed service units, and the
          monitor service were not changed; the receiver remains stopped
      when: spectral_line_update_only | default(false) | bool

    - name: Finish this host after the compiled code update
      meta: end_host
      when: spectral_line_update_only | default(false) | bool

    - name: Require a supported Debian or Ubuntu target
      assert:
        that:
          - ansible_system == "Linux"
          - ansible_os_family == "Debian"
          - ansible_distribution in ["Debian", "Ubuntu"]
        fail_msg: >-
          This playbook supports Debian and Ubuntu targets only; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.

    - name: Install build dependencies
      apt:
        name:
          - build-essential
          - git
          - ipmitool
          - libelf-dev
          - libfmt-dev
          - libnuma-dev
          - libpcap-dev
          - libspdlog-dev
          - libyaml-cpp-dev
          - meson
          - ninja-build
          - pkg-config
          - python3-pip
          - python3-pyelftools
          - python3-setuptools
          - python3-venv
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the service group
      group:
        name: "{{ spectral_line_service_user }}"
        system: true

    - name: Create the service account
      user:
        name: "{{ spectral_line_service_user }}"
        group: "{{ spectral_line_service_user }}"
        system: true
        home: "{{ spectral_line_install_dir }}"
        create_home: false
        shell: /usr/sbin/nologin

    - name: Create the installation directory
      file:
        path: "{{ spectral_line_install_dir }}"
        state: directory
        owner: "{{ spectral_line_service_user }}"
        group: "{{ spectral_line_service_user }}"
        mode: "0755"

    - name: Check for installed service units
      stat:
        path: "/etc/systemd/system/{{ item }}"
      loop:
        - spectral-line.service
        - spectral-line-monitor.service
      register: spectral_line_installed_service_units

    - name: Stop the installed services before replacing their files
      systemd:
        name: "{{ item.item }}"
        state: stopped
      loop: "{{ spectral_line_installed_service_units.results }}"
      when: item.stat.exists

    - name: Deploy the controller source archive
      unarchive:
        src: "{{ hostvars['localhost'].spectral_line_local_archive }}"
        dest: "{{ spectral_line_install_dir }}"
        owner: "{{ spectral_line_service_user }}"
        group: "{{ spectral_line_service_user }}"

    - name: Deploy this server's static config.yaml
      include_tasks: tasks/configure-subbands.yml

    - name: Verify required build commands and libraries
      become_user: "{{ spectral_line_service_user }}"
      command:
        argv: "{{ item }}"
      environment: "{{ spectral_line_build_environment }}"
      loop:
        - [meson, --version]
        - [ninja, --version]
        - [nvcc, --version]
        - [pkg-config, --exists, libdpdk, spdlog, fmt, yaml-cpp]
      changed_when: false

    - name: Remove the previous build directory
      file:
        path: "{{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}"
        state: absent

    - name: Create an empty build directory
      file:
        path: "{{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}"
        state: directory
        owner: "{{ spectral_line_service_user }}"
        group: "{{ spectral_line_service_user }}"
        mode: "0755"

    - name: Configure a clean release build
      become_user: "{{ spectral_line_service_user }}"
      command:
        argv:
          - meson
          - setup
          - "{{ spectral_line_build_dir }}"
          - --buildtype=release
        chdir: "{{ spectral_line_install_dir }}"
      environment: "{{ spectral_line_build_environment }}"

    - name: Compile Spectral_line
      become_user: "{{ spectral_line_service_user }}"
      command:
        argv:
          - meson
          - compile
          - -C
          - "{{ spectral_line_build_dir }}"
        chdir: "{{ spectral_line_install_dir }}"
      environment: "{{ spectral_line_build_environment }}"

    - name: Verify the receiver executable
      stat:
        path: "{{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}/7mm"
      register: spectral_line_executable

    - name: Require a compiled receiver executable
      assert:
        that:
          - spectral_line_executable.stat.exists
          - spectral_line_executable.stat.isreg
        fail_msg: The build completed without producing the 7mm executable.

    - name: Create the monitor Python virtual environment
      become_user: "{{ spectral_line_service_user }}"
      command:
        argv:
          - python3
          - -m
          - venv
          - "{{ spectral_line_install_dir }}/.venv"
        creates: "{{ spectral_line_install_dir }}/.venv/bin/python"

    - name: Install monitor Python dependencies
      become_user: "{{ spectral_line_service_user }}"
      pip:
        requirements: "{{ spectral_line_install_dir }}/monitor/requirements.txt"
        executable: "{{ spectral_line_install_dir }}/.venv/bin/pip"

    - name: Install systemd service units
      template:
        src: "templates/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - spectral-line.service
        - spectral-line-monitor.service
      notify: Reload systemd

    - name: Apply installed systemd units
      meta: flush_handlers

    - name: Enable and start the monitor service
      systemd:
        name: spectral-line-monitor.service
        enabled: true
        state: started

    - name: Keep the receiver service disabled and stopped
      systemd:
        name: spectral-line.service
        enabled: false
        state: stopped

    - name: Report deployment result
      debug:
        msg: >-
          {{ inventory_hostname }} compiled
          {{ spectral_line_install_dir }}/{{ spectral_line_build_dir }}/7mm;
          the monitor service is enabled and running;
          the receiver service is disabled and stopped for coordinated startup

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: true

- name: Remove the controller source archive
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Delete the temporary archive
      file:
        path: "{{ hostvars['localhost'].spectral_line_local_archive }}"
        state: absent

- import_playbook: summary.yml
  when: not (spectral_line_update_only | default(false) | bool)
