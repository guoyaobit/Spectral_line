---
# Complete static configuration for GPU6 (server7).
# 100G input: ETH0=10.17.16.23, ETH1=10.17.16.24.
# Edit this file on the Ansible controller, then deploy it with
# ansible-playbook -i ansible/inventory.yml ansible/configure-subbands.yml
Debug: false
ServerID: 6
# Optional: the system controller may set one shared ID on every node and the
# Recorder. Leave commented for manual mode; spectrum packets then use obs_id=0.
# Observation_ID: 20260924T000000Z_example_scan001
# Per receive stream, in GiB. All 16 streams enabled: 128 GiB plus overhead.
Memory_pool_per_stream: 8
observation_mode: 1
cal_mode: false
# Noise-switch timing; used only when cal_mode is true.
noise_source:
  period_ms: 1000
  duty_cycle: 50
integration_t: 1 # Seconds, rounded down to complete FFT intervals
win_bw: 256e6
win_channels: 65536
# FFT length = round(256e6 / win_bw * win_channels): 65536..16777216,
# divisible by 4096. At 256 MHz, 32768 channels is not supported.
Storage_node_ip: 192.168.101.11
# Baseband mode only.
Baseband_Folder0: /data
Baseband_Folder1: /data1
Baseband_bits: 8 # I/Q component width: 8, 4, or 2 bits
subband_monitor: true
# Used only when local_sdfits.enabled is true; match Recorder scan metadata.
object: test                 # OBJECT
source_on: true              # SRCSTATE and automatic directory name
sdfits_metadata:
  telescope: NSRT            # TELESCOP
  instrument: 7mm            # INSTRUME
  # Actual ICRS pointing; OFF scans need their actual pointing.
  # ra_deg: 9.1979583333
  # dec_deg: 63.4839166667
  # site_lon_deg: 87.10       # East-positive degrees
  # site_lat_deg: 43.28       # Degrees
  # site_height_m: 2029.38    # Metres
# Spectral-line mode only; same SDFITS format as Recorder.
local_sdfits:
  enabled: false
  storage_folder: /data
  queue_mb: 2048             # MiB, shared by all local subband/window files
subbands:
  # port is the outgoing ZeroMQ/TCP result port, not the 100G input UDP port.
  # DPDK port 0 (ETH0, 10.17.16.23), input UDP 60000/60001: beam A, V/H.
  - gpu_id: 0
    enable: true
    beam: A
    start_freq: 2432e6
    end_freq: 2688e6
    port: 60000
    windows:
      - center_freq: 2560e6
  # DPDK port 0 (ETH0, 10.17.16.23), input UDP 60002/60003: beam B, V/H.
  - gpu_id: 0
    enable: true
    beam: B
    start_freq: 2432e6
    end_freq: 2688e6
    port: 60001
    windows:
      - center_freq: 2560e6
  # DPDK port 0 (ETH0, 10.17.16.23), input UDP 60004/60005: beam A, V/H.
  - gpu_id: 1
    enable: true
    beam: A
    start_freq: 2688e6
    end_freq: 2944e6
    port: 60002
    windows:
      - center_freq: 2816e6
  # DPDK port 0 (ETH0, 10.17.16.23), input UDP 60006/60007: beam B, V/H.
  - gpu_id: 1
    enable: true
    beam: B
    start_freq: 2688e6
    end_freq: 2944e6
    port: 60003
    windows:
      - center_freq: 2816e6
  # DPDK port 1 (ETH1, 10.17.16.24), input UDP 60000/60001: beam A, V/H.
  - gpu_id: 2
    enable: true
    beam: A
    start_freq: 2944e6
    end_freq: 3200e6
    port: 60004
    windows:
      - center_freq: 3072e6
  # DPDK port 1 (ETH1, 10.17.16.24), input UDP 60002/60003: beam B, V/H.
  - gpu_id: 2
    enable: true
    beam: B
    start_freq: 2944e6
    end_freq: 3200e6
    port: 60005
    windows:
      - center_freq: 3072e6
  # DPDK port 1 (ETH1, 10.17.16.24), input UDP 60004/60005: beam A, V/H.
  - gpu_id: 3
    enable: true
    beam: A
    start_freq: 3200e6
    end_freq: 3456e6
    port: 60006
    windows:
      - center_freq: 3328e6
  # DPDK port 1 (ETH1, 10.17.16.24), input UDP 60006/60007: beam B, V/H.
  - gpu_id: 3
    enable: true
    beam: B
    start_freq: 3200e6
    end_freq: 3456e6
    port: 60007
    windows:
      - center_freq: 3328e6
