---
# Complete static configuration for GPU4 (server5).
# Source: docs/数据分配新.xlsx, 服务器角度, rows 65-80.
# RF coverage: 33984-35008 MHz; workbook IF reference: 384-1408 MHz.
# start_freq/end_freq/center_freq below are RF in Hz.
# 100G input: ETH0=10.17.16.19, ETH1=10.17.16.20.
# Edit this file on the Ansible controller, then deploy it with
# ansible-playbook -i ansible/inventory.yml ansible/configure-subbands.yml
Debug: false
ServerID: 4
# Optional: the system controller may set one shared ID on every node and the
# Recorder. Leave commented for manual mode; spectrum packets then use obs_id=0.
# Observation_ID: 20260924T000000Z_example_scan001
# Per receive stream, in GiB. All 16 streams enabled: 128 GiB plus overhead.
Memory_pool_per_stream: 8
observation_mode: 1
cal_mode: false
# Noise-switch timing; used only when cal_mode is true.
noise_source:
  period_ms: 1000
  duty_cycle: 50
integration_t: 1 # Seconds, rounded down to complete FFT intervals
win_bw: 256e6
win_channels: 65536
# FFT length = round(256e6 / win_bw * win_channels): 65536..16777216,
# divisible by 4096. At 256 MHz, 32768 channels is not supported.
Storage_node_ip: 192.168.101.11
# Baseband mode only.
Baseband_Folder0: /data
Baseband_Folder1: /data1
Baseband_bits: 8 # I/Q component width: 8, 4, or 2 bits
subband_monitor: true
# Used only when local_sdfits.enabled is true; match Recorder scan metadata.
object: test                 # OBJECT
source_on: true              # SRCSTATE and automatic directory name
sdfits_metadata:
  telescope: NSRT            # TELESCOP
  instrument: 7mm            # INSTRUME
  # Actual ICRS pointing; OFF scans need their actual pointing.
  # ra_deg: 9.1979583333
  # dec_deg: 63.4839166667
  # site_lon_deg: 87.10       # East-positive degrees
  # site_lat_deg: 43.28       # Degrees
  # site_height_m: 2029.38    # Metres
# Spectral-line mode only; same SDFITS format as Recorder.
local_sdfits:
  enabled: false
  storage_folder: /data
  queue_mb: 2048             # MiB, shared by all local subband/window files
subbands:
  # Ordered A/B pairs; each entry receives V/H over the fixed UDP pair below.
  # port is the independent ZeroMQ/TCP result destination, not an input port.
  # GPU4 / server5: ETH0=10.17.16.19, DPDK port 0, UDP 60000/60001 (V/H).
  # Global subband 16, beam A; IF input reference 384-640 MHz.
  - gpu_id: 0
    enable: true
    beam: A
    start_freq: 33984e6
    end_freq: 34240e6
    port: 60000
    windows:
      - center_freq: 34112e6
  # GPU4 / server5: ETH0=10.17.16.19, DPDK port 0, UDP 60002/60003 (V/H).
  # Global subband 16, beam B; IF input reference 384-640 MHz.
  - gpu_id: 0
    enable: true
    beam: B
    start_freq: 33984e6
    end_freq: 34240e6
    port: 60001
    windows:
      - center_freq: 34112e6
  # GPU4 / server5: ETH0=10.17.16.19, DPDK port 0, UDP 60004/60005 (V/H).
  # Global subband 17, beam A; IF input reference 640-896 MHz.
  - gpu_id: 1
    enable: true
    beam: A
    start_freq: 34240e6
    end_freq: 34496e6
    port: 60002
    windows:
      - center_freq: 34368e6
  # GPU4 / server5: ETH0=10.17.16.19, DPDK port 0, UDP 60006/60007 (V/H).
  # Global subband 17, beam B; IF input reference 640-896 MHz.
  - gpu_id: 1
    enable: true
    beam: B
    start_freq: 34240e6
    end_freq: 34496e6
    port: 60003
    windows:
      - center_freq: 34368e6
  # GPU4 / server5: ETH1=10.17.16.20, DPDK port 1, UDP 60000/60001 (V/H).
  # Global subband 18, beam A; IF input reference 896-1152 MHz.
  - gpu_id: 2
    enable: true
    beam: A
    start_freq: 34496e6
    end_freq: 34752e6
    port: 60004
    windows:
      - center_freq: 34624e6
  # GPU4 / server5: ETH1=10.17.16.20, DPDK port 1, UDP 60002/60003 (V/H).
  # Global subband 18, beam B; IF input reference 896-1152 MHz.
  - gpu_id: 2
    enable: true
    beam: B
    start_freq: 34496e6
    end_freq: 34752e6
    port: 60005
    windows:
      - center_freq: 34624e6
  # GPU4 / server5: ETH1=10.17.16.20, DPDK port 1, UDP 60004/60005 (V/H).
  # Global subband 19, beam A; IF input reference 1152-1408 MHz.
  - gpu_id: 3
    enable: true
    beam: A
    start_freq: 34752e6
    end_freq: 35008e6
    port: 60006
    windows:
      - center_freq: 34880e6
  # GPU4 / server5: ETH1=10.17.16.20, DPDK port 1, UDP 60006/60007 (V/H).
  # Global subband 19, beam B; IF input reference 1152-1408 MHz.
  - gpu_id: 3
    enable: true
    beam: B
    start_freq: 34752e6
    end_freq: 35008e6
    port: 60007
    windows:
      - center_freq: 34880e6
