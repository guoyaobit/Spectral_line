---
- name: Resolve the server ID for this host
  set_fact:
    spectral_line_effective_server_id: >-
      {{ spectral_line_server_id | default(
         inventory_hostname | regex_search('[0-9]+$')) }}

- name: Require a server ID between zero and seven
  assert:
    that:
      - spectral_line_effective_server_id | string is match('^[0-9]+$')
      - spectral_line_effective_server_id | int >= 0
      - spectral_line_effective_server_id | int <= 7
    fail_msg: >-
      Set spectral_line_server_id to an integer from 0 through 7 for
      {{ inventory_hostname }}, or end its inventory hostname with that ID.

- name: Select the static configuration file
  set_fact:
    spectral_line_effective_server_id: "{{ spectral_line_effective_server_id | int }}"
    spectral_line_static_config_path: >-
      {{ playbook_dir }}/configs/GPU{{ spectral_line_effective_server_id | int }}.yaml

- name: Check the static configuration file
  stat:
    path: "{{ spectral_line_static_config_path }}"
  delegate_to: localhost
  become: false
  register: spectral_line_static_config_stat

- name: Require the static configuration file
  assert:
    that:
      - spectral_line_static_config_stat.stat.exists
      - spectral_line_static_config_stat.stat.isreg
    fail_msg: "Static configuration not found: {{ spectral_line_static_config_path }}"

- name: Read the static configuration for validation
  include_vars:
    file: "{{ spectral_line_static_config_path }}"
    name: spectral_line_static_config
  delegate_to: localhost
  become: false

- name: Resolve the observation ID
  set_fact:
    spectral_line_effective_observation_id: >-
      {{ spectral_line_observation_id |
         default(spectral_line_static_config.Observation_ID | default('')) }}

- name: Validate the static server configuration
  assert:
    that:
      - spectral_line_static_config.ServerID | int == spectral_line_effective_server_id | int
      - spectral_line_effective_observation_id is string
      - >-
        (spectral_line_effective_observation_id | length == 0) or
        (spectral_line_effective_observation_id | length <= 64)
      - >-
        (spectral_line_effective_observation_id | length == 0) or
        (spectral_line_effective_observation_id is match('^[A-Za-z0-9._-]+$'))
      - >-
        (spectral_line_effective_observation_id | length == 0) or
        (spectral_line_effective_observation_id not in ['.', '..'])
      - spectral_line_static_config.subbands | length == 8
      - spectral_line_static_config.subbands | map(attribute='beam') | list ==
        ['A', 'B', 'A', 'B', 'A', 'B', 'A', 'B']
      - spectral_line_static_config.subbands | map(attribute='port') | list ==
        [60000, 60001, 60002, 60003, 60004, 60005, 60006, 60007]
      - spectral_line_static_config.subbands | map(attribute='gpu_id') | list ==
        [0, 0, 1, 1, 2, 2, 3, 3]
      - spectral_line_static_config.subbands[0].start_freq == spectral_line_static_config.subbands[1].start_freq
      - spectral_line_static_config.subbands[0].end_freq == spectral_line_static_config.subbands[1].end_freq
      - spectral_line_static_config.subbands[2].start_freq == spectral_line_static_config.subbands[3].start_freq
      - spectral_line_static_config.subbands[2].end_freq == spectral_line_static_config.subbands[3].end_freq
      - spectral_line_static_config.subbands[4].start_freq == spectral_line_static_config.subbands[5].start_freq
      - spectral_line_static_config.subbands[4].end_freq == spectral_line_static_config.subbands[5].end_freq
      - spectral_line_static_config.subbands[6].start_freq == spectral_line_static_config.subbands[7].start_freq
      - spectral_line_static_config.subbands[6].end_freq == spectral_line_static_config.subbands[7].end_freq
    fail_msg: >-
      {{ spectral_line_static_config_path }} must have the matching ServerID,
      an optional safe 1-64 character Observation_ID, exactly eight subbands,
      the A/B beam layout, GPU layout, matching A/B frequency ranges, and
      output ports 60000-60007.

- name: Copy the static configuration to the server
  copy:
    src: "{{ spectral_line_static_config_path }}"
    dest: "{{ spectral_line_install_dir }}/config.yaml"
    owner: "{{ spectral_line_service_user }}"
    group: "{{ spectral_line_service_user }}"
    mode: "0644"

- name: Apply the observation ID selected by the controller
  lineinfile:
    path: "{{ spectral_line_install_dir }}/config.yaml"
    regexp: '^\\s*#?\\s*Observation_ID:'
    line: "Observation_ID: {{ spectral_line_effective_observation_id }}"
    owner: "{{ spectral_line_service_user }}"
    group: "{{ spectral_line_service_user }}"
    mode: "0644"
  when: spectral_line_effective_observation_id | length > 0

- name: Report the selected static configuration
  debug:
    msg: >-
      {{ inventory_hostname }} ServerID={{ spectral_line_effective_server_id }}
      Observation_ID={{ spectral_line_effective_observation_id
        if (spectral_line_effective_observation_id | length > 0)
        else 'manual (obs_id=0)' }} uses
      {{ spectral_line_static_config_path }}
