Debug: false
# 0~7 influence result filename
ServerID: 0
# don't make the memory pool size > 128GB
Memory_pool_per_stream: 8 # GB
observation_mode: 1 # 0: baseband, 1: spectral line, 2: continuum
cal_mode: false
noise_source:
  period_ms: 1000
  duty_cycle: 50
integration_t: 1 # Intergration time s
win_bw: 256e6 # window bandwidth Hz; e.g. 1e6,2e6,4e6,32e6,64e6,256e6
win_channels: 65536 # window channels  32768,65536
# Spectrum result destination. Sender_Nic is a kernel-managed SR-IOV VF.
Storage_node_ip: 192.168.101.11
Storage_node_mac:  04:3f:72:f3:bc:8a
Sender_Nic: ens81f0v0
# disk1
Baseband_Folder0: /data
# disk2
Baseband_Folder1: /data1
# baseband_bits 8,4,2
Baseband_bits: 8
subband_monitor: true
subbands:
  # Every `port` value below is the destination UDP port on Storage_node_ip
  # used to send the processed spectrum result. It does NOT configure the
  # fixed 100G DPDK input UDP ports, even though both ranges are 60000-60007.
  # Input: DPDK port 0, UDP 60000 (X) and 60001 (Y).
  # subband 0
  - gpu_id: 0
    enable: true
    beam: A # spectrum_header beam_id=0
    start_freq: 384e6
    end_freq: 640e6
    port: 60000 # result destination UDP port
    windows:
      - center_freq: 512e6
    # - center_freq: 2201e6
    # - center_freq: 2202e6
    # - center_freq: 2203e6
  # subband 1: DPDK port 0, UDP 60002 (X) and 60003 (Y).
  - gpu_id: 0
    enable: true
    beam: A # spectrum_header beam_id=0
    start_freq: 640e6
    end_freq: 896e6
    port: 60001 # result destination UDP port
    windows:
      - center_freq: 768e6
    # - center_freq: 2501e6
    # - center_freq: 2502e6
    # - center_freq: 2503e6
  # subband 2: DPDK port 0, UDP 60004 (X) and 60005 (Y).
  - gpu_id: 1
    enable: true
    beam: A # spectrum_header beam_id=0
    start_freq: 896e6
    end_freq: 1152e6
    port: 60002 # result destination UDP port
    windows:
      - center_freq: 1024e6
  # subband 3: DPDK port 0, UDP 60006 (X) and 60007 (Y).
  - gpu_id: 1
    enable: true
    beam: A # spectrum_header beam_id=0
    start_freq: 1152e6
    end_freq: 1408e6
    port: 60003 # result destination UDP port
    windows:
      - center_freq: 1280e6
  # subband 4: DPDK port 1, UDP 60000 (X) and 60001 (Y).
  - gpu_id: 2
    enable: true
    beam: B # spectrum_header beam_id=1
    start_freq: 1408e6
    end_freq: 1664e6
    port: 60004 # result destination UDP port
    windows:
      - center_freq: 1536e6

  # subband 5: DPDK port 1, UDP 60002 (X) and 60003 (Y).
  - gpu_id: 2
    enable: true
    beam: B # spectrum_header beam_id=1
    start_freq: 1664e6
    end_freq: 1920e6
    port: 60005 # result destination UDP port
    windows:
      - center_freq: 1792e6

  # subband 6: DPDK port 1, UDP 60004 (X) and 60005 (Y).
  - gpu_id: 3
    enable: true
    beam: B # spectrum_header beam_id=1
    start_freq: 1920e6
    end_freq: 2176e6
    port: 60006 # result destination UDP port
    windows:
      - center_freq: 2048e6

  # subband 7: DPDK port 1, UDP 60006 (X) and 60007 (Y).
  - gpu_id: 3
    enable: true
    beam: B # spectrum_header beam_id=1
    start_freq: 2176e6
    end_freq: 2432e6
    port: 60007 # result destination UDP port
    windows:
      - center_freq: 2304e6
