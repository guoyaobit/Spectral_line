Debug: false
# Default node: GPU0 / server1, matching ansible/configs/GPU0.yaml.
# Source: docs/数据分配新.xlsx, 服务器角度, rows 1-16.
# 100G inputs: ETH0=10.17.16.11, ETH1=10.17.16.12 (hardware reference).
# Frequencies below are RF in Hz; coverage is 29984-31008 MHz.
# Node ID (0-7); also determines global subband IDs.
ServerID: 0
# Optional. A controller sets the same unique value on every GPU node and the
# Recorder. If omitted, spectrum results use obs_id=0 and baseband mode creates
# an ISO-8601 basic UTC observation directory such as 20260925T143012.317Z.
# Observation_ID: 20260924T000000Z_example_scan001
# Per receive stream, in GiB. All 16 streams enabled: 128 GiB plus overhead.
Memory_pool_per_stream: 8
observation_mode: 1 # 0: baseband, 1: spectral line, 2: continuum
cal_mode: false
# Noise-switch timing; used only when cal_mode is true.
noise_source:
  period_ms: 1000
  duty_cycle: 50
integration_t: 1 # Seconds, rounded down to complete FFT intervals
win_bw: 256e6 # window bandwidth Hz; e.g. 1e6,2e6,4e6,32e6,64e6,256e6
win_channels: 65536
# FFT length = round(256e6 / win_bw * win_channels): 65536..16777216,
# divisible by 4096. At 256 MHz, 32768 channels is not supported.
# Spectrum result destination. Linux routing selects the output interface.
Storage_node_ip: 192.168.101.11
# Baseband mode only.
Baseband_Folder0: /data
Baseband_Folder1: /data1
Baseband_bits: 8 # I/Q component width: 8, 4, or 2 bits
subband_monitor: true
# Used only when local_sdfits.enabled is true; match Recorder scan metadata.
object: test                 # OBJECT column
source_on: true              # SRCSTATE: ON=true, OFF=false; also used in filenames
sdfits_metadata:
  telescope: NSRT            # TELESCOP
  instrument: 7mm            # INSTRUME
  # Actual ICRS pointing in degrees; OFF scans need their actual pointing.
  # ra_deg: 9.1979583333      # CRVAL4
  # dec_deg: 63.4839166667    # CRVAL5
  # site_lon_deg: 87.10      # SITELONG, east-positive degrees
  # site_lat_deg: 43.28      # SITELAT, degrees
  # site_height_m: 2029.38   # SITEELEV, metres
# Spectral-line mode only; same SDFITS format as Recorder.
local_sdfits:
  enabled: false
  storage_folder: /data
  queue_mb: 2048             # MiB, shared by all local subband/window files
subbands:
  # Ordered A/B pairs; each entry receives V/H over the fixed UDP pair below.
  # port is the independent ZeroMQ/TCP result destination, not an input port.
  # GPU0 / server1: ETH0=10.17.16.11, DPDK port 0, UDP 60000/60001 (V/H).
  # Global subband 0, beam A; IF input reference 384-640 MHz.
  - gpu_id: 0
    enable: true
    beam: A
    start_freq: 29984e6
    end_freq: 30240e6
    port: 60000
    windows:
      - center_freq: 30112e6
  # GPU0 / server1: ETH0=10.17.16.11, DPDK port 0, UDP 60002/60003 (V/H).
  # Global subband 0, beam B; IF input reference 384-640 MHz.
  - gpu_id: 0
    enable: true
    beam: B
    start_freq: 29984e6
    end_freq: 30240e6
    port: 60001
    windows:
      - center_freq: 30112e6
  # GPU0 / server1: ETH0=10.17.16.11, DPDK port 0, UDP 60004/60005 (V/H).
  # Global subband 1, beam A; IF input reference 640-896 MHz.
  - gpu_id: 1
    enable: true
    beam: A
    start_freq: 30240e6
    end_freq: 30496e6
    port: 60002
    windows:
      - center_freq: 30368e6
  # GPU0 / server1: ETH0=10.17.16.11, DPDK port 0, UDP 60006/60007 (V/H).
  # Global subband 1, beam B; IF input reference 640-896 MHz.
  - gpu_id: 1
    enable: true
    beam: B
    start_freq: 30240e6
    end_freq: 30496e6
    port: 60003
    windows:
      - center_freq: 30368e6
  # GPU0 / server1: ETH1=10.17.16.12, DPDK port 1, UDP 60000/60001 (V/H).
  # Global subband 2, beam A; IF input reference 896-1152 MHz.
  - gpu_id: 2
    enable: true
    beam: A
    start_freq: 30496e6
    end_freq: 30752e6
    port: 60004
    windows:
      - center_freq: 30624e6
  # GPU0 / server1: ETH1=10.17.16.12, DPDK port 1, UDP 60002/60003 (V/H).
  # Global subband 2, beam B; IF input reference 896-1152 MHz.
  - gpu_id: 2
    enable: true
    beam: B
    start_freq: 30496e6
    end_freq: 30752e6
    port: 60005
    windows:
      - center_freq: 30624e6
  # GPU0 / server1: ETH1=10.17.16.12, DPDK port 1, UDP 60004/60005 (V/H).
  # Global subband 3, beam A; IF input reference 1152-1408 MHz.
  - gpu_id: 3
    enable: true
    beam: A
    start_freq: 30752e6
    end_freq: 31008e6
    port: 60006
    windows:
      - center_freq: 30880e6
  # GPU0 / server1: ETH1=10.17.16.12, DPDK port 1, UDP 60006/60007 (V/H).
  # Global subband 3, beam B; IF input reference 1152-1408 MHz.
  - gpu_id: 3
    enable: true
    beam: B
    start_freq: 30752e6
    end_freq: 31008e6
    port: 60007
    windows:
      - center_freq: 30880e6
