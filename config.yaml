Debug: false
# 0~7 influence result filename
ServerID: 0
# Optional. A controller sets the same unique value on every GPU node and the
# Recorder. If omitted, spectrum results use obs_id=0 and baseband mode creates
# an ISO-8601 basic UTC observation directory such as 20260925T143012.317Z.
# Observation_ID: 20260924T000000Z_example_scan001
# don't make the memory pool size > 128GB
Memory_pool_per_stream: 8 # GB
observation_mode: 1 # 0: baseband, 1: spectral line, 2: continuum
cal_mode: false
noise_source:
  period_ms: 1000
  duty_cycle: 50
integration_t: 1 # Intergration time s
win_bw: 256e6 # window bandwidth Hz; e.g. 1e6,2e6,4e6,32e6,64e6,256e6
win_channels: 65536 # window channels  32768,65536
# Spectrum result destination. Linux routing selects the kernel-managed output
# interface and performs normal neighbour discovery; the program does not set
# a static ARP entry. Sender_Nic is optional deployment-summary metadata
# and is not used by the ZeroMQ sender.
Storage_node_ip: 192.168.101.11
Sender_Nic: ens81f0v0
# disk1
Baseband_Folder0: /data
# disk2
Baseband_Folder1: /data1
# baseband_bits 8,4,2
Baseband_bits: 8
subband_monitor: true
# Shared SDFITS scan metadata; use the same keys on processing nodes and Recorder.
object: test                 # OBJECT column
source_on: true              # SRCSTATE: ON=true, OFF=false; also used in filenames
sdfits_metadata:
  telescope: NSRT            # TELESCOP
  instrument: 7mm            # INSTRUME
  # Actual ICRS pointing in degrees; OFF scans need their actual pointing.
  # ra_deg: 9.1979583333      # CRVAL4
  # dec_deg: 63.4839166667    # CRVAL5
  # site_lon_deg: 87.10      # SITELONG, east-positive degrees
  # site_lat_deg: 43.28      # SITELAT, degrees
  # site_height_m: 2029.38   # SITEELEV, metres
# Optional local copy of the spectral-line output. The generated SDFITS uses
# the same template, headers, columns and DATA layout as Spectral_Line_Recorder.
local_sdfits:
  enabled: false
  storage_folder: /data
  queue_mb: 2048
subbands:
  # Every `port` value below is the destination ZeroMQ/TCP port on Storage_node_ip
  # used to send the processed spectrum result. Values may be arbitrary TCP
  # ports and multiple subbands may share one port. Recorder obtains subband,
  # beam and window identities from spectrum_header, not from the port number.
  # It does NOT configure the fixed 100G DPDK input UDP ports.
  # DPDK port 0, UDP 60000/60001: beam A, V/H.
  - gpu_id: 0
    enable: true
    beam: A # spectrum_header beam_id=0
    start_freq: 384e6
    end_freq: 640e6
    port: 60000 # result destination ZeroMQ/TCP port
    windows:
      - center_freq: 512e6
  # DPDK port 0, UDP 60002/60003: beam B, V/H.
  - gpu_id: 0
    enable: true
    beam: B # spectrum_header beam_id=1
    start_freq: 384e6
    end_freq: 640e6
    port: 60001 # result destination ZeroMQ/TCP port
    windows:
      - center_freq: 512e6
  # DPDK port 0, UDP 60004/60005: beam A, V/H.
  - gpu_id: 1
    enable: true
    beam: A # spectrum_header beam_id=0
    start_freq: 640e6
    end_freq: 896e6
    port: 60002 # result destination ZeroMQ/TCP port
    windows:
      - center_freq: 768e6
  # DPDK port 0, UDP 60006/60007: beam B, V/H.
  - gpu_id: 1
    enable: true
    beam: B # spectrum_header beam_id=1
    start_freq: 640e6
    end_freq: 896e6
    port: 60003 # result destination ZeroMQ/TCP port
    windows:
      - center_freq: 768e6
  # DPDK port 1, UDP 60000/60001: beam A, V/H.
  - gpu_id: 2
    enable: true
    beam: A # spectrum_header beam_id=0
    start_freq: 896e6
    end_freq: 1152e6
    port: 60004 # result destination ZeroMQ/TCP port
    windows:
      - center_freq: 1024e6
  # DPDK port 1, UDP 60002/60003: beam B, V/H.
  - gpu_id: 2
    enable: true
    beam: B # spectrum_header beam_id=1
    start_freq: 896e6
    end_freq: 1152e6
    port: 60005 # result destination ZeroMQ/TCP port
    windows:
      - center_freq: 1024e6
  # DPDK port 1, UDP 60004/60005: beam A, V/H.
  - gpu_id: 3
    enable: true
    beam: A # spectrum_header beam_id=0
    start_freq: 1152e6
    end_freq: 1408e6
    port: 60006 # result destination ZeroMQ/TCP port
    windows:
      - center_freq: 1280e6
  # DPDK port 1, UDP 60006/60007: beam B, V/H.
  - gpu_id: 3
    enable: true
    beam: B # spectrum_header beam_id=1
    start_freq: 1152e6
    end_freq: 1408e6
    port: 60007 # result destination ZeroMQ/TCP port
    windows:
      - center_freq: 1280e6
